services:
  aggregator:
    build: .
    image: gateway-log-aggregator:1.0.0
    container_name: gateway-log-aggregator
    ports:
      - "8000:8000"
    environment:
      LOG_DATA_DIR: /data
      WORK_DIR: /work
      # Enables the demo-only /sources/unavailable and /sources/restore endpoints.
      ALLOW_SIMULATION: "true"
      # Per single service process: maximum number of source shards read at
      # once. Initial scans, rescans and repair/backfill reads share these
      # slots. Free slots go first to jobs that have shards queued but no read
      # in flight; leftover slots read multiple shards of one job in parallel.
      # The image runs one uvicorn worker, so this is the process-wide cap.
      SOURCE_READ_CONCURRENCY: "${SOURCE_READ_CONCURRENCY:-2}"
    volumes:
      # Source shards are read-only to the service.
      - ./samples/data:/data:ro
      # Temporary partition files and job manifests survive container restarts.
      - aggregator-work:/work
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  aggregator-work:
